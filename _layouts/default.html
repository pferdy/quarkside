<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="masthead">
      <div class="brand">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/86346103?v=4" alt="QuarkSaur, the Quarkside logo" width="56" height="56">
        <a class="logo" href="{{ '/' | relative_url }}"><span class="q">Q</span>UARKSIDE</a>
      </div>
      <form class="searchbox" action="{{ '/search/' | relative_url }}" method="get">
        <input type="search" name="q" placeholder="Search posts&hellip;" aria-label="Search posts" autocomplete="off">
      </form>
      <nav class="site">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
    <p class="tagline">{{ site.description }}</p>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site">
  <div class="wrap">
    &copy; Leonard Anderson · <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</footer>
</body>
</html>
